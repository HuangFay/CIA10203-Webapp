<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>早餐店後台管理</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .responsive-img {
            width: auto;
            height: auto;
        }
        /* 新增CSS樣式，讓下拉表單在懸停時展開 */
        .nav-item.dropdown:hover .dropdown-menu {
            display: block;
        }
        .nav-item.dropdown:hover .nav-link {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">早餐店後台管理</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="reservationDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        訂位管理
                    </a>
                    <div class="dropdown-menu" aria-labelledby="reservationDropdown">
                        <a class="dropdown-item" href="/res/listAllRes">顯示全部訂位</a>
                        <a class="dropdown-item" href="/restime/listAllResTime">訂位桌椅</a>
                        <a class="dropdown-item" href="/res/editTimes">訂位時間</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/meals">餐點管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/orders">訂單管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/permissions">權限管理</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/login">登入</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">登出</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="text-center">
            <img th:src="@{/images/huh.png}" alt="Breakfast Shop" class="img-fluid">
        </div>
        <div th:if="${pageName == 'reservations'}">
            <h2>訂位管理</h2>
            <!-- 訂位管理功能的表格或內容 -->
        </div>
        <div th:if="${pageName == 'meals'}">
            <h2>餐點管理</h2>
            <!-- 餐點管理功能的表格或內容 -->
        </div>
        <div th:if="${pageName == 'orders'}">
            <h2>訂單管理</h2>
            <!-- 訂單管理功能的表格或內容 -->
        </div>
        <div th:if="${pageName == 'permissions'}">
            <h2>權限管理</h2>
            <!-- 權限管理功能的表格或內容 -->
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
